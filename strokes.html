<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>제목 획 미리보기</title>
<style>
  body { margin: 0; background: #2b2326; color: #eee; font: 13px/1.5 system-ui, -apple-system, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; }
  header b { color: #ffb3c4; }
  button, select, input { font: inherit; }
  button { padding: 4px 10px; border: 0; border-radius: 4px; background: #f4ecee; color: #2a1d21; cursor: pointer; }
  button.primary { background: #b72c50; color: #fff; }
  .stage { position: relative; margin: 8px 16px; background: #F8F1EB; border-radius: 6px; }
  .stage svg { display: block; width: 100%; height: auto; }
  .stage .overlay { position: absolute; inset: 0; pointer-events: none; }
  .ghost { position: absolute; inset: 0; width: 100%; opacity: .12; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 0 8px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  aside { padding: 8px 16px 24px; }
  .glyph { margin-bottom: 10px; padding: 8px; border-radius: 6px; background: rgba(255,255,255,.06); }
  .glyph h3 { margin: 0 0 4px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .stroke { display: flex; gap: 4px; align-items: center; margin: 3px 0; }
  .stroke input { width: 56px; }
  .muted { color: #b9aab0; }
  .timing label { display: block; margin: 4px 0; }
  .timing input { width: 70px; }
  #status { color: #9fe0a8; min-height: 1.5em; }
  .low { color: #ff9c9c; }
</style>
</head>
<body>
<header>
  <b>제목 획 미리보기</b>
  <button class="primary" id="play">▶ 재생</button>
  <button id="prev">◀ 한 획</button><button id="next">한 획 ▶</button>
  <label>속도 <select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option></select></label>
  <label><input type="checkbox" id="lines" checked> 획 번호·방향 보기</label>
  <label><input type="checkbox" id="ghost" checked> 완성 제목 옅게 깔기</label>
  <span class="muted" id="info"></span>
</header>
<main>
  <div>
    <div class="stage" id="stage"></div>
    <p class="muted" style="margin: 0 16px">노란 원 = 획 시작(번호 = 쓰는 순서), 작은 점 = 획 끝. 경로 모양을 바꾸고 싶으면 번호와 함께 말로 알려 주세요.</p>
  </div>
  <aside>
    <div id="list"></div>
    <div class="timing glyph">
      <h3>타이밍 (ms)</h3>
      <label>쓰기 전체 <input type="number" step="50" data-t="write_ms"></label>
      <label>글자 사이 쉼 <input type="number" step="10" data-t="letter_pause_ms"></label>
      <label>다음 글자 미리 시작 (0~0.5) <input type="number" step="0.02" min="0" max="0.5" data-t="letter_overlap"></label>
      <label>획 사이 쉼 <input type="number" step="10" data-t="stroke_pause_ms"></label>
    </div>
    <div class="glyph">
      <h3>덮임 % <span class="muted">(굵기를 바꾸면 tools/title_strokes.py로 다시 계산)</span></h3>
      <div id="coverage"></div>
    </div>
    <div style="display:flex; gap:6px">
      <button class="primary" id="save" hidden>저장</button>
      <button id="copy">복사</button>
    </div>
    <div id="status"></div>
  </aside>
</main>

<script type="module">
import { writeTitle, setProgress, strokesOf, schedule, readTiming } from './js/title-write.js';

const data = JSON.parse(document.getElementById('strokes-data').textContent);
const TITLE = './img/title-1400.webp';
const NAMES = { E: 'É (몸)', accent: '악센트', c: 'c', l: 'l', o: 'o', r: 'r', e: 'e' };
const byId = () => Object.fromEntries(data.glyphs.map((g) => [g.id, g]));
const [W, H] = data.viewBox;
const pts = (d) => (d.match(/[-\d.]+,[-\d.]+/g) || []).map((p) => p.split(',').map(Number));
const ptsD = (a) => 'M' + a.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' L');
let anims = [];
let step = -1;

function svgMarkup() {
  const g = byId();
  return `<img class="ghost" src="${TITLE}" alt="">
  <svg class="title-write" viewBox="0 0 ${W} ${H}" data-timing='${JSON.stringify(data.timing)}'>
  <defs>${data.glyphs.map((x) => `<clipPath id="pv-c-${x.id}" clipPathUnits="userSpaceOnUse"><path d="${x.region}"/></clipPath>`).join('')}
  <mask id="pv-m" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="${data.stroke_width}">
  ${data.order.map((id) => `<g clip-path="url(#pv-c-${id})">${g[id].strokes.map((s) => `<path d="${s.d}" pathLength="1" stroke-dasharray="1 2" data-glyph="${id}"${s.w ? ` stroke-width="${s.w}"` : ''}/>`).join('')}</g>`).join('')}
  </g></mask></defs>
  <image href="${TITLE}" width="${W}" height="${H}" preserveAspectRatio="none" mask="url(#pv-m)"/></svg>
  <svg class="overlay" viewBox="0 0 ${W} ${H}">${overlay()}</svg>`;
}

function overlay() {
  const g = byId();
  let n = 0;
  return data.order.map((id) => g[id].strokes.map((s) => {
    n += 1;
    const p = pts(s.d);
    const [x0, y0] = p[0];
    const [x1, y1] = p[p.length - 1];
    return `<path d="${s.d}" fill="none" stroke="#1d2a6b" stroke-width="5" stroke-linejoin="round" opacity=".8"/>
      <circle cx="${x1}" cy="${y1}" r="9" fill="#1d2a6b"/>
      <circle cx="${x0}" cy="${y0}" r="22" fill="#ffd400" stroke="#1d2a6b" stroke-width="3"/>
      <text x="${x0}" y="${y0 + 9}" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2a6b">${n}</text>`;
  }).join('')).join('');
}

function render() {
  const stage = document.getElementById('stage');
  stage.innerHTML = svgMarkup();
  stage.querySelector('.overlay').style.display = document.getElementById('lines').checked ? '' : 'none';
  stage.querySelector('.ghost').style.display = document.getElementById('ghost').checked ? '' : 'none';
  setProgress(strokesOf(stage.querySelector('.title-write')), true);
  step = -1;
  list();
  const t = readTiming(stage.querySelector('.title-write'));
  const plan = schedule(strokesOf(stage.querySelector('.title-write')), t);
  const end = plan.length ? plan[plan.length - 1].at + plan[plan.length - 1].dur : 0;
  document.getElementById('info').textContent = `획 ${plan.length}개 · 쓰기 ${Math.round(end)}ms · 굵기 ${data.stroke_width}px`;
}

function list() {
  const g = byId();
  let n = 0;
  document.getElementById('list').innerHTML = data.order.map((id, gi) => `
    <div class="glyph"><h3>${NAMES[id] || id}
      <button data-a="gup" data-g="${gi}">↑</button><button data-a="gdown" data-g="${gi}">↓</button></h3>
      ${g[id].strokes.map((s, si) => { n += 1; return `<div class="stroke"><b>${n}</b>
        <button data-a="up" data-id="${id}" data-s="${si}">↑</button><button data-a="down" data-id="${id}" data-s="${si}">↓</button>
        <button data-a="rev" data-id="${id}" data-s="${si}">방향 뒤집기</button>
        <input type="number" step="2" placeholder="${data.stroke_width}" value="${s.w || ''}" data-w="${id}:${si}" title="굵기(px)"></div>`; }).join('')}
    </div>`).join('');
  document.getElementById('coverage').innerHTML = Object.entries(data.coverage || {})
    .map(([k, v]) => `<span class="${v < 99 ? 'low' : ''}">${NAMES[k] || k} ${v}%</span>`).join(' · ');
  for (const inp of document.querySelectorAll('[data-t]')) inp.value = data.timing[inp.dataset.t];
}

function stop() { for (const a of anims) a.cancel(); anims = []; }

document.getElementById('play').onclick = () => {
  stop();
  const svg = document.querySelector('#stage .title-write');
  anims = writeTitle(svg, { speed: parseFloat(document.getElementById('speed').value) });
};
function showStep(k) {
  stop();
  const s = strokesOf(document.querySelector('#stage .title-write'));
  step = Math.max(-1, Math.min(s.length - 1, k));
  s.forEach((x, i) => { x.el.style.strokeDashoffset = i <= step ? '0' : '1'; x.el.style.strokeOpacity = i <= step ? '1' : '0'; });
  document.getElementById('status').textContent = step < 0 ? '' : `${step + 1}번 획까지`;
}
document.getElementById('next').onclick = () => showStep(step + 1);
document.getElementById('prev').onclick = () => showStep(step - 1);
document.getElementById('lines').onchange = render;
document.getElementById('ghost').onchange = render;

document.getElementById('list').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const a = b.dataset.a;
  if (a === 'gup' || a === 'gdown') {
    const i = +b.dataset.g, j = a === 'gup' ? i - 1 : i + 1;
    if (j < 0 || j >= data.order.length) return;
    [data.order[i], data.order[j]] = [data.order[j], data.order[i]];
  } else {
    const st = byId()[b.dataset.id].strokes, i = +b.dataset.s;
    if (a === 'rev') st[i].d = ptsD(pts(st[i].d).reverse());
    else {
      const j = a === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= st.length) return;
      [st[i], st[j]] = [st[j], st[i]];
    }
  }
  dirty();
});
document.getElementById('list').addEventListener('change', (e) => {
  const w = e.target.dataset.w;
  if (!w) return;
  const [id, si] = w.split(':');
  const s = byId()[id].strokes[+si];
  if (e.target.value) s.w = +e.target.value; else delete s.w;
  dirty();
});
for (const inp of document.querySelectorAll('[data-t]')) {
  inp.onchange = () => { data.timing[inp.dataset.t] = +inp.value; dirty(); };   // 바꾼 뒤 ▶ 재생으로 확인
}
function dirty() { render(); document.getElementById('status').textContent = '바뀜 · 저장하거나 복사하세요'; }

const payload = () => ({ order: data.order, timing: data.timing, glyphs: data.glyphs.map((g) => ({ id: g.id, strokes: g.strokes })) });
document.getElementById('copy').onclick = async () => {
  const text = JSON.stringify(payload(), null, 1);
  try { await navigator.clipboard.writeText(text); } catch {
    const ta = Object.assign(document.createElement('textarea'), { value: text }); document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  document.getElementById('status').textContent = '복사됨 · 그대로 보내 주세요';
};
fetch('/__version', { cache: 'no-store' }).then(async (r) => { await r.text(); if (r.ok) document.getElementById('save').hidden = false; }).catch(() => {});
document.getElementById('save').onclick = async () => {
  const r = await fetch('/__strokes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload()) });
  document.getElementById('status').textContent = r.ok ? '저장됨 · 다시 빌드 중…' : `저장 실패: ${await r.text()}`;
  if (r.ok) setTimeout(() => location.reload(), 1500);
};

render();
</script>
</body>
</html>
